name: Sync IMF PortWatch data

on:
  schedule:
    # IMF PortWatch refreshes source data Tuesdays 9AM ET (13:00 UTC in EDT / 14:00 UTC in EST).
    # Run a few hours after to be safe, and re-check midweek in case of late corrections.
    - cron: "0 18 * * 2"  # Tuesday 18:00 UTC
    - cron: "0 6 * * 5"   # Friday 06:00 UTC (safety net for revisions)
    # Saturday 02:00 UTC: reload ONE static dataset, rotating across the five on a
    # 5-week cycle. They can't all run in one job -- ~6.95M rows combined overran
    # the timeout and truncated supplychain mid-load -- and they're IMF snapshots
    # that change rarely, so one per week keeps each run inside its budget and
    # caps how long a republished snapshot goes unnoticed at 5 weeks.
    - cron: "0 2 * * 6"
  workflow_dispatch:       # manual "Run workflow" button, with overrides
    inputs:
      sync_since_days:
        description: "Days of port/chokepoint daily-activity history to (re)pull. Use a large value (e.g. 3000) for a one-time full backfill."
        required: false
        default: "30"
      load_static_datasets:
        description: "Also (re)load all 5 Spillover/Climate tables sequentially. Prefer sync_target below instead -- this can exceed the job timeout on the larger tables."
        required: false
        default: "false"
        type: boolean
      sync_target:
        description: "Run ONLY this one dataset (recommended for static-dataset loads and backfills, so each run fits the time budget). Leave blank for the normal weekly run."
        required: false
        default: ""
        type: choice
        options:
          - ""
          - ports
          - chokepoints
          - port_activity
          - chokepoint_activity
          - disruptions
          - spillover_port
          - spillover_country_trade
          - spillover_supplychain
          - climate_port_risk
          - climate_trade_risk

jobs:
  sync:
    # Tuesday/Friday refresh + any manual run. Skipped on the Saturday cron,
    # which is the static-dataset rotation below.
    if: github.event_name != 'schedule' || github.event.schedule != '0 2 * * 6'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Sync ArcGIS FeatureServer -> Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_SINCE_DAYS: ${{ github.event.inputs.sync_since_days || '30' }}
          LOAD_STATIC_DATASETS: ${{ github.event.inputs.load_static_datasets || 'false' }}
          SYNC_TARGET: ${{ github.event.inputs.sync_target || '' }}
        run: python scripts/sync_portwatch.py

  # One static dataset per week, rotating. Each gets a whole job (and the full
  # timeout) to itself, which is what the sequential all-five run never had.
  sync-static:
    if: github.event_name == 'schedule' && github.event.schedule == '0 2 * * 6'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Pick this week's static dataset
        id: pick
        run: |
          set -euo pipefail
          TARGETS=(spillover_port spillover_country_trade spillover_supplychain \
                   climate_port_risk climate_trade_risk)
          # 10# forces base-10: ISO weeks 08 and 09 are invalid octal and would
          # abort the run under `set -e`.
          WEEK=$((10#$(date -u +%V)))
          TARGET="${TARGETS[$((WEEK % 5))]}"
          echo "ISO week $WEEK -> $TARGET"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Sync one static dataset -> Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_TARGET: ${{ steps.pick.outputs.target }}
        run: python scripts/sync_portwatch.py
